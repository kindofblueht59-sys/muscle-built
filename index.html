<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>筋トレノート</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="筋トレノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one-column logbook, sticky header, bottom tab bar (thumb reach on iPhone). Chalk-and-steel palette. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#e7e9e5; --fg:#1d2321; --muted:#5f6a66; --line:#d3d8d3;
  --accent:#1f5f8b; --accent-fg:#ffffff; --accent-soft:#dce8f1;
  --good:#2e7d4f; --good-soft:#dff0e5; --warn:#a86a12; --warn-soft:#f6ead5; --bad:#b03a2e; --bad-soft:#f6dedb;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141817; --surface:#1c2220; --sunk:#252c2a; --fg:#e6ebe8; --muted:#9aa6a1; --line:#33403c;
  --accent:#6cb0de; --accent-fg:#0d1b24; --accent-soft:#1f3443;
  --good:#6cc790; --good-soft:#1d3427; --warn:#e0aa55; --warn-soft:#3a2e1a; --bad:#ec8378; --bad-soft:#3d2320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141817; --surface:#1c2220; --sunk:#252c2a; --fg:#e6ebe8; --muted:#9aa6a1; --line:#33403c;
  --accent:#6cb0de; --accent-fg:#0d1b24; --accent-soft:#1f3443;
  --good:#6cc790; --good-soft:#1d3427; --warn:#e0aa55; --warn-soft:#3a2e1a; --bad:#ec8378; --bad-soft:#3d2320; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
[hidden]{display:none!important}
#status span{overflow:hidden;text-overflow:ellipsis;max-width:46vw}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
header h1{font-family:var(--font-num);font-weight:700;font-size:22px;margin:0;letter-spacing:.04em;text-transform:uppercase}
header h1 small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0;text-transform:none}
#status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
#status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
#status[data-s="ok"] i{background:var(--good)} #status[data-s="busy"] i{background:var(--warn)} #status[data-s="err"] i{background:var(--bad)}
main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;padding:12px 4px 10px;font-size:13px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button b{font-family:var(--font-num);font-size:18px;font-weight:600;letter-spacing:.06em}
nav.tabs button[aria-current="page"]{color:var(--accent)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0;display:flex;align-items:center;gap:8px}
h2 .sp{margin-left:auto;font-weight:500;letter-spacing:0}
h3{font-size:16px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.big{padding:13px;font-size:16px;width:100%}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;min-width:40px;text-align:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;gap:4px}
.stepper button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;font-size:18px;cursor:pointer}
.stepper input{text-align:center;font-family:var(--font-num);font-size:22px;font-weight:600;padding:6px 4px}
.hint{font-size:13px;color:var(--muted)}
.memo-ex{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.up{background:var(--good-soft);color:var(--good)} .pill.flat{background:var(--sunk);color:var(--muted)} .pill.down{background:var(--bad-soft);color:var(--bad)} .pill.new{background:var(--accent-soft);color:var(--accent)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.exgroup{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.exgroup:first-child{border-top:0;padding-top:0}
.exhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.exhead .e1{margin-left:auto;font-size:13px;color:var(--muted)}
.setline{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--sunk);cursor:pointer;border:1px solid transparent}
.setline.wu{opacity:.6}
textarea.exnote{min-height:44px;font-size:16px}
.setline.editing{border-color:var(--accent)}
.setline .n{font-family:var(--font-num);color:var(--muted);font-size:15px}
.setline .main{font-family:var(--font-num);font-size:20px;font-weight:600}
.setline .main small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.setline .meta{font-size:12px;color:var(--muted);text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:8px 10px}
.stat .k{font-size:11px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--font-num);font-size:24px;font-weight:600;line-height:1.1}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:84px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .t span{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar .c{font-family:var(--font-num);font-size:16px;text-align:right}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;background:var(--surface)}
.day .dn{font-size:11px;color:var(--muted)}
.day .dd{font-family:var(--font-num);font-size:18px;font-weight:600}
.day.today{border-color:var(--accent)}
.day button.pl{border:1px dashed var(--line);background:none;border-radius:6px;font-size:11px;padding:3px 0;width:100%;cursor:pointer;color:var(--muted)}
.day button.pl[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.day input[type="time"]{font-size:12px;padding:2px;text-align:center;border-radius:6px}
.day .act{font-size:11px;font-weight:700;text-align:center;line-height:1.3}
.act.ok{color:var(--good)} .act.miss{color:var(--bad)} .act.extra{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.exlist{display:flex;flex-direction:column}
.exitem{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.exitem:last-child{border-bottom:0}
.exitem .nm{font-weight:500}
.exitem .sub{font-size:12px;color:var(--muted)}
.exitem .rt{margin-left:auto;display:flex;align-items:center;gap:8px}
.partlabel{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-top:10px}
svg.chart{width:100%;height:auto;display:block}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
.notice{background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:12px 14px;font-size:14px}
.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 8px 6px 16px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.restbar b{font-family:var(--font-num);font-size:22px;font-weight:600;min-width:52px}
.restbar button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .wk{font-family:var(--font-num);font-size:22px;font-weight:600;flex:1;text-align:center}
.weeknav .wk small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:400}
.saved-note{font-size:11px;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)} .grid4{grid-template-columns:repeat(2,1fr)} .bar{grid-template-columns:72px 1fr 30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%}
img{max-width:100%}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:12px}
.login h2{font-size:15px;color:var(--fg);letter-spacing:0}
body.signedout nav.tabs{display:none}
</style>
</head>
<body class="signedout">

<header>
  <h1>筋トレノート<small id="hdate"></small></h1>
  <div id="status" data-s="busy"><i></i><span>接続中…</span></div>
</header>
<main id="view"></main>
<div id="rest" class="restbar" hidden><span>レスト</span><b id="restt" class="num">0:00</b><button type="button" id="restx">停止</button></div>
<nav class="tabs" aria-label="画面切り替え">
  <button type="button" data-tab="today"><b>DAY</b>今日の記録</button>
  <button type="button" data-tab="week"><b>WEEK</b>週の集計</button>
  <button type="button" data-tab="ex"><b>LIFT</b>種目と推移</button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(() => {
"use strict";
const PARTS = ["胸","背中","肩","二頭","三頭","前もも","ハム・尻","ふくらはぎ","腹","その他"];
const PRESETS = [["ベンチプレス","胸"],["インクラインダンベルプレス","胸"],["ラットプルダウン","背中"],["ベントオーバーロウ","背中"],["ショルダープレス","肩"],["サイドレイズ","肩"],["バーベルカール","二頭"],["ケーブルプレスダウン","三頭"],["スクワット","前もも"],["レッグプレス","前もも"],["ルーマニアンデッドリフト","ハム・尻"],["カーフレイズ","ふくらはぎ"],["アブローラー","腹"]];
const DOW = ["月","火","水","木","金","土","日"];

/* ---------- date helpers (local time, Monday-start ISO weeks) ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d,12); };
const today = () => ymd(new Date());
function isoWeek(s){
  const d = parse(s); const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day+3);
  const y = d.getFullYear(); const jan4 = new Date(y,0,4,12);
  const w = 1 + Math.round(((d-jan4)/86400000 - 3 + (jan4.getDay()+6)%7)/7);
  return y+"-W"+pad(w);
}
function weekDays(wk){
  const [y,w] = wk.split("-W").map(Number); const jan4 = new Date(y,0,4,12);
  const mon = new Date(jan4); mon.setDate(jan4.getDate()-((jan4.getDay()+6)%7)+(w-1)*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon); d.setDate(mon.getDate()+i); return ymd(d);});
}
const shiftWeek = (wk,n) => { const d = parse(weekDays(wk)[0]); d.setDate(d.getDate()+7*n); return isoWeek(ymd(d)); };
const md = s => { const d = parse(s); return (d.getMonth()+1)+"/"+d.getDate(); };
const dowOf = s => DOW[(parse(s).getDay()+6)%7];

/* ---------- training math ---------- */
// e1RM: Epley with reps-in-reserve added (reps to failure = reps + RIR).
function e1rm(w,r,rir){ w=+w; r=+r; if(!(w>0)||!(r>0)) return 0; const rf = r + (rir==null||rir===""?0:+rir); return rf<=1 ? w : w*(1+rf/30); }
const r1 = x => Math.round(x*10)/10;
const work = s => (s.sets||[]).filter(x=>!x.wu);
function exDay(sess, exId){ return work(sess).filter(x=>x.ex===exId); }
function weekMetrics(wk, exId){
  let best=0, vol=0, sets=0;
  for(const d of weekDays(wk)){ const s=S.ses[d]; if(!s) continue;
    for(const x of exDay(s,exId)){ sets++; vol+= (+x.w||0)*(+x.r||0); best=Math.max(best,e1rm(x.w,x.r,x.rir)); } }
  return {best,vol,sets};
}
// Progressive overload check: this week vs the most recent earlier week (up to 8 back) that has this lift.
function overload(wk, exId){
  const cur = weekMetrics(wk, exId); if(!cur.sets) return null;
  let prev=null, pk=null;
  for(let i=1;i<=8;i++){ const k=shiftWeek(wk,-i); const m=weekMetrics(k,exId); if(m.sets){prev=m; pk=k; break;} }
  if(!prev) return {cls:"new",label:"初回",cur};
  // 重量0（自重種目など）は推定1RMが出ないので判定しない
  if(!(cur.best>0) || !(prev.best>0)) return {cls:"flat",label:"判定不可（重量0）",cur,prev:null,pk};
  const dE = (cur.best-prev.best)/prev.best, dV = prev.vol? (cur.vol-prev.vol)/prev.vol : 0;
  let cls,label;
  if(dE>=0.01){cls="up";label="前進（強度）";}
  else if(dE>-0.01 && dV>=0.05){cls="up";label="前進（量）";}
  else if(dE>-0.01){cls="flat";label="維持";}
  else if(dV>=0.05){cls="warn";label="強度↓ 量↑";}
  else {cls="down";label="後退";}
  return {cls,label,cur,prev,pk,dE,dV};
}

/* ---------- state ---------- */
const S = { ex:{}, ses:{}, wk:{}, tab:"today", date:today(), week:isoWeek(today()), exSel:null, editing:null,
  form:{ex:"",w:"",r:"",rir:"2",rest:"",wu:false}, loaded:{ex:false,ses:false,wk:false}, db:null, ro:false, err:"" };
try{ const t = localStorage.getItem("kt_tab"); if(t) S.tab=t; const f=localStorage.getItem("kt_form"); if(f) Object.assign(S.form, JSON.parse(f)); }catch(e){}
let restStart = null; try{ const r=+localStorage.getItem("kt_rest"); if(r && Date.now()-r < 20*60000) restStart=r; }catch(e){}
const remember = () => { try{ localStorage.setItem("kt_tab",S.tab); localStorage.setItem("kt_form",JSON.stringify(S.form)); localStorage.setItem("kt_rest", restStart||""); }catch(e){} };

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));
const exName = id => S.ex[id]?.name || "（削除された種目）";
const exList = () => Object.entries(S.ex).map(([id,v])=>({id,...v})).sort((a,b)=>PARTS.indexOf(a.part)-PARTS.indexOf(b.part)||(a.order||0)-(b.order||0)||a.name.localeCompare(b.name,"ja"));

/* ---------- saving: Firestore keeps writes in the device cache first, then sends them in order ---------- */
const dirty = {}; let inflight = 0;
function setStatus(){
  const el = document.getElementById("status");
  if(!S.user){ el.dataset.s="busy"; el.lastChild.textContent = "ログインしてください"; return; }
  if(!S.db){ el.dataset.s="err"; el.lastChild.textContent = "未接続"; return; }
  if(S.err){ el.dataset.s="err"; el.lastChild.textContent=S.err; return; }
  if(inflight){ el.dataset.s="busy"; el.lastChild.textContent = navigator.onLine===false ? "端末に保存済み・送信待ち" : "保存中…"; return; }
  if(navigator.onLine===false){ el.dataset.s="busy"; el.lastChild.textContent="オフライン（端末に保存）"; return; }
  el.dataset.s = (S.loaded.ex&&S.loaded.ses&&S.loaded.wk) ? "ok":"busy";
  el.lastChild.textContent = el.dataset.s==="ok" ? "保存済み・同期中" : "読み込み中…";
}
window.addEventListener("online", setStatus); window.addEventListener("offline", setStatus);
function save(path, data){
  if(!S.db || S.ro) return;
  delete dirty[path]; inflight++; setStatus();
  const ref = S.db.doc(path);
  (data===null ? ref.delete() : ref.set(data))
    .then(()=>{ if(S.err && /保存/.test(S.err)) S.err=""; })
    .catch(e=>{
      if(e && e.code==="permission-denied"){ S.ro=true; S.err="このアカウントでは書き込めません"; }
      else if(e && e.code==="resource-exhausted"){ S.err="無料枠の上限です。明日まで待ってください"; }
      else { S.err="保存に失敗しました。通信を確認してください"; }
    })
    .finally(()=>{ inflight--; setStatus(); });
}
const blankSession = d => ({date:d, condition:null, bw:"", sleep:"", memo:"", sets:[]});
function mutateSession(d, fn, rerender=true){
  const s = clone(S.ses[d] || blankSession(d)); fn(s); s.updatedAt = new Date().toISOString(); S.ses[d]=s;
  save("sessions/"+d, s); if(rerender) render();
}
const blankWeek = k => ({week:k, focus:"", plan:[], confirmedAt:null});
function mutateWeek(k, fn, rerender=true){
  const w = clone(S.wk[k] || blankWeek(k)); fn(w); w.updatedAt = new Date().toISOString(); S.wk[k]=w;
  save("weeks/"+k, w); if(rerender) render();
}
const timers = {};
const debounce = (key, ms, fn) => { clearTimeout(timers[key]); timers[key]=setTimeout(fn,ms); };

/* ---------- rendering ---------- */
let pending = false;
function render(){
  const ae = document.activeElement;
  if(ae && ae.closest && ae.closest("#view") && (ae.tagName==="TEXTAREA" || (ae.tagName==="INPUT" && /^(text|search|)$/.test(ae.getAttribute("type")||"")))){ pending = true; return; }
  pending = false;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===S.tab?"page":"false"));
  document.getElementById("hdate").textContent = md(today())+"（"+dowOf(today())+"）";
  const v = document.getElementById("view");
  document.body.classList.toggle("signedout", !S.user);
  if(!S.user){ v.innerHTML = vLogin(); setStatus(); return; }
  const top = S.db ? "" : `<div class="notice">${esc(S.err||"データに接続できません。")}</div>`;
  v.innerHTML = top + (S.tab==="today" ? vToday() : S.tab==="week" ? vWeek() : vEx());
  setStatus(); remember();
}
document.addEventListener("focusout", () => setTimeout(()=>{ if(pending) render(); }, 0));

function lastSetsOf(exId, beforeDate){
  const days = Object.keys(S.ses).filter(d=>d<beforeDate).sort().reverse();
  for(const d of days){ const xs = exDay(S.ses[d], exId); if(xs.length) return {d, xs}; }
  return null;
}
const fmtSet = x => `${+x.w}×${+x.r}${x.rir!==""&&x.rir!=null?"@"+x.rir:""}`;
const fmtRest = s => { s=+s; if(!s) return ""; return Math.floor(s/60)+":"+pad(s%60); };

    <textarea class="exnote" id="xn-${g.ex}" data-ex="${g.ex}" rows="2" aria-label="${esc(exName(g.ex))}のメモ" placeholder="この種目のメモ（フォーム・効き・痛みなど）">${esc((s.exNotes||{})[g.ex]||"")}</textarea></div>`; }).join("")

function weekSummary(wk){
  const days = weekDays(wk); const wkdoc = S.wk[wk] || blankWeek(wk);
  const parts = Object.fromEntries(PARTS.map(p=>[p,0])); let sets=0, vol=0, trained=[]; const exSet = new Set();
  for(const d of days){ const s=S.ses[d]; if(!s) continue; const ws=work(s); if(ws.length) trained.push(d);
    for(const x of ws){ sets++; vol+=(+x.w||0)*(+x.r||0); const p=S.ex[x.ex]?.part||"その他"; parts[p]=(parts[p]||0)+1; exSet.add(x.ex);} }
  // 予実は確定した予定と比べる（確定後に予定を変えても、確定時の予定は confirmedPlan に残る）
  const base = wkdoc.confirmedPlan || wkdoc.plan || [];
  const planned = base.map(p=>p.date);
  const changed = !!wkdoc.confirmedPlan && JSON.stringify(wkdoc.confirmedPlan)!==JSON.stringify(wkdoc.plan||[]);
  const done = planned.filter(d=>trained.includes(d)), missed = planned.filter(d=>!trained.includes(d)&&d<today()), extra = trained.filter(d=>!planned.includes(d));
  return {days,wkdoc,parts,sets,vol,trained,planned,done,missed,extra,changed,ex:[...exSet]};
}
function vWeek(){
  const wk=S.week, W=weekSummary(wk), t=today();
  const maxP = Math.max(1,...Object.values(W.parts));
  const daysHtml = W.days.map((d,i)=>{
    const p = (W.wkdoc.plan||[]).find(x=>x.date===d); const tr = W.trained.includes(d); const cp = W.planned.includes(d);
    let act = "";
    if(W.wkdoc.confirmedPlan){ if(cp&&tr) act=`<span class="act ok">予定通り<br>実施</span>`; else if(cp&&!tr&&d<t) act=`<span class="act miss">未実施</span>`; else if(!cp&&tr) act=`<span class="act extra">予定外<br>実施</span>`; else if(cp) act=`<span class="act hint">予定</span>`; }
    else if(p&&tr) act=`<span class="act ok">予定通り<br>実施</span>`; else if(p&&!tr&&d<t) act=`<span class="act miss">未実施</span>`; else if(!p&&tr) act=`<span class="act extra">予定外<br>実施</span>`; else if(p) act=`<span class="act hint">予定</span>`;
    return `<div class="day ${d===t?"today":""}"><span class="dn">${DOW[i]}</span><span class="dd">${parse(d).getDate()}</span>
      <button type="button" class="pl" data-act="plan" data-d="${d}" aria-pressed="${!!p}">${p?"ジム":"＋予定"}</button>
      ${p?`<input type="time" data-act="ptime" data-d="${d}" value="${esc(p.time||"")}" aria-label="${md(d)}の開始時刻">`:""}${act}</div>`; }).join("");
  const ol = W.ex.map(id=>({id,o:overload(wk,id)})).filter(x=>x.o).sort((a,b)=>PARTS.indexOf(S.ex[a.id]?.part)-PARTS.indexOf(S.ex[b.id]?.part));
  const dayRows = W.days.filter(d=>S.ses[d] && (work(S.ses[d]).length || S.ses[d].memo || S.ses[d].condition)).map(d=>{ const s=S.ses[d]; const exs=[...new Set(work(s).map(x=>x.ex))].map(exName).join("、");
    return `<tr><td class="num" style="font-size:15px">${md(d)}（${dowOf(d)}）</td><td class="r num" style="font-size:15px">${work(s).length}</td><td class="r num" style="font-size:15px">${s.condition??"—"}</td><td>${esc(exs)}${s.memo?`<div class="hint">${esc(s.memo)}</div>`:""}</td></tr>`; }).join("");
  const conf = W.wkdoc.confirmedAt;
  return `
  <section class="card"><div class="weeknav">
    <button type="button" class="btn" data-act="wk-" aria-label="前の週">‹</button>
    <div class="wk">${wk}<small>${md(W.days[0])}（月）〜 ${md(W.days[6])}（日）</small></div>
    <button type="button" class="btn" data-act="wk+" aria-label="次の週">›</button></div>
    ${wk!==isoWeek(t)?`<button type="button" class="btn" data-act="wk0">今週へ</button>`:""}
  </section>
  <section class="card"><h2>今週の数字</h2><div class="stats">
    <div class="stat"><div class="k">ジム 実施／予定</div><div class="v">${W.trained.length}<small>／${W.planned.length}日</small></div></div>
    <div class="stat"><div class="k">本番セット</div><div class="v">${W.sets}<small>set</small></div></div>
    <div class="stat"><div class="k">総挙上量</div><div class="v">${(Math.round(W.vol/10)/100).toLocaleString()}<small>t</small></div></div>
    <div class="stat"><div class="k">予定外／未実施</div><div class="v">${W.extra.length}<small>／${W.missed.length}日</small></div></div></div></section>
  <section class="card"><h2>ジムの予定と実績<span class="sp">${conf?`<span class="pill up">確定 ${md(conf.slice(0,10))}</span>`:`<span class="pill flat">未確定</span>`}</span></h2>
    <div class="days">${daysHtml}</div>
    <div class="row"><button type="button" class="btn pri" data-act="confirm" ${!(W.wkdoc.plan||[]).length?"disabled":""}>${conf?"予定を確定し直す":"この予定で確定する"}</button>
    <span class="hint">確定した予定を TickTick とカレンダーへ登録するのは、Codex に依頼して行います。</span></div>
    ${W.changed?`<div class="notice">確定後に予定を変えています。予実は確定した予定で判定しています。変更を反映するには確定し直してください。</div>`:""}</section>
  <section class="card"><h2>部位別 週間セット数</h2><div class="bars">${PARTS.filter(p=>W.parts[p]||p!=="その他").map(p=>`<div class="bar"><span>${p}</span><span class="t"><span style="width:${W.parts[p]/maxP*100}%"></span></span><span class="c num">${W.parts[p]}</span></div>`).join("")}</div>
    <div class="hint">ウォームアップを除いたセット数。種目に設定した部位で数えます。</div></section>
  <section class="card"><h2>漸進性過負荷のチェック</h2>
    ${ol.length?`<div class="scroll"><table><thead><tr><th>種目</th><th class="r">推定1RM</th><th class="r">前回比</th><th class="r">挙上量</th><th>判定</th></tr></thead><tbody>
    ${ol.map(({id,o})=>`<tr><td>${esc(exName(id))}</td><td class="r num" style="font-size:15px">${r1(o.cur.best)}</td><td class="r num" style="font-size:15px">${o.prev?(o.dE>=0?"+":"")+r1(o.dE*100)+"%":"—"}</td><td class="r num" style="font-size:15px">${Math.round(o.cur.vol).toLocaleString()}${o.prev?`<div class="hint">${(o.dV>=0?"+":"")+r1(o.dV*100)}%</div>`:""}</td><td><span class="pill ${o.cls}">${o.label}</span></td></tr>`).join("")}
    </tbody></table></div><div class="hint">その種目を前回行った週と比べます。推定1RMが1%以上伸びれば「前進（強度）」、横ばいでも挙上量が5%以上増えれば「前進（量）」。</div>`
    :`<div class="empty">この週の本番セットが記録されると、種目ごとに前回の週と比べた判定が出ます。</div>`}</section>
  <section class="card"><h2>今週意識したこと</h2>
    <textarea id="f-focus" placeholder="例：ベンチは肩甲骨を寄せたまま下ろす。脚の日を増やす">${esc(W.wkdoc.focus)}</textarea>
    <div class="saved-note">入力すると自動で保存されます。</div></section>
  <section class="card"><h2>日ごとの記録</h2>${dayRows?`<div class="scroll"><table><thead><tr><th>日付</th><th class="r">セット</th><th class="r">体調</th><th>種目・メモ</th></tr></thead><tbody>${dayRows}</tbody></table></div>`:`<div class="empty">この週の記録はまだありません。</div>`}
    <button type="button" class="btn" data-act="copymd">この週をMarkdownでコピー</button></section>`;

function exHistory(exId){
  return Object.keys(S.ses).sort().map(d=>{ const xs=exDay(S.ses[d],exId); if(!xs.length) return null;
    return {d, xs, note:(S.ses[d].exNotes||{})[exId]||"", best:Math.max(...xs.map(x=>e1rm(x.w,x.r,x.rir))), vol:xs.reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0), top:Math.max(...xs.map(x=>+x.w||0))}; }).filter(Boolean);
}
function chart(h){
  if(h.length<2) return `<div class="empty">2回以上記録すると推定1RMの推移グラフが出ます。</div>`;
  const W=640,H=220,L=44,R=14,T=14,B=30;
  const t0=parse(h[0].d).getTime(), t1=parse(h[h.length-1].d).getTime(), span=Math.max(1,t1-t0);
  const ys=h.map(p=>p.best), lo=Math.min(...ys), hi=Math.max(...ys);
  const step = (()=>{ const r=(hi-lo)||hi*0.1||10; const raw=r/4; const m=Math.pow(10,Math.floor(Math.log10(raw))); return [1,2,2.5,5,10].map(k=>k*m).find(k=>k>=raw); })();
  const y0=Math.floor((lo-step*0.5)/step)*step, y1=Math.ceil((hi+step*0.5)/step)*step;
  const X=t=>L+(t-t0)/span*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const ticks=[]; for(let v=y0; v<=y1+1e-9; v+=step) ticks.push(v);
  const pts=h.map(p=>[X(parse(p.d).getTime()),Y(p.best)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`;
  const last=pts[pts.length-1];
  const xl = [h[0], h[Math.floor((h.length-1)/2)], h[h.length-1]].filter((p,i,a)=>a.findIndex(q=>q.d===p.d)===i);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="推定1RMの推移">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Barlow Condensed, sans-serif">${r1(v)}</text>`).join("")}
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)"/>
    ${xl.map(p=>`<text x="${X(parse(p.d).getTime())}" y="${H-8}" text-anchor="${p===h[0]?"start":p===h[h.length-1]?"end":"middle"}" font-size="12" fill="var(--muted)" font-family="Barlow Condensed, sans-serif">${md(p.d)}</text>`).join("")}
  </svg>`;
}
function vEx(){
  const list = exList();
  if(S.exSel && S.ex[S.exSel]){
    const id=S.exSel, e=S.ex[id], h=exHistory(id), o=overload(isoWeek(today()),id) || (h.length?overload(isoWeek(h[h.length-1].d),id):null);
    const best = h.length?Math.max(...h.map(p=>p.best)):0;
    return `<section class="card"><div class="row"><button type="button" class="btn ghost" data-act="exback">‹ 種目一覧</button></div>
      <div class="grid2"><label class="f">種目名<input id="e-name" value="${esc(e.name)}"></label>
      <label class="f">部位<select id="e-part">${PARTS.map(p=>`<option ${p===e.part?"selected":""}>${p}</option>`).join("")}</select></label></div>
      <label class="f">設定メモ（シート位置・グリップ幅・フォームの注意など）<textarea id="e-memo" placeholder="例：シート高さ4、背もたれ2段目。肘は45度">${esc(e.memo||"")}</textarea></label>
      <div class="saved-note">入力すると自動で保存されます。記録画面でこの種目を選ぶとメモが表示されます。</div></section>

      <div class="stats"><div class="stat"><div class="k">最高 推定1RM</div><div class="v">${best?r1(best):"—"}<small>kg</small></div></div>
      <div class="stat"><div class="k">最新 推定1RM</div><div class="v">${h.length?r1(h[h.length-1].best):"—"}<small>kg</small></div></div>
      <div class="stat"><div class="k">実施回数</div><div class="v">${h.length}<small>回</small></div></div>
      <div class="stat"><div class="k">最新 最大重量</div><div class="v">${h.length?h[h.length-1].top:"—"}<small>kg</small></div></div></div>
      ${chart(h)}<div class="hint">推定1RM ＝ 重量 ×（1 ＋（回数＋RIR）÷ 30）。その日の本番セットで最も高い値を点にしています。</div></section>
    <section class="card"><h2>記録の履歴</h2>${h.length?`<div class="scroll"><table><thead><tr><th>日付</th><th>セット（kg×回@RIR）</th><th class="r">推定1RM</th><th class="r">挙上量</th></tr></thead><tbody>
      ${h.slice().reverse().map(p=>`<tr><td class="num" style="font-size:15px;white-space:nowrap">${md(p.d)}（${dowOf(p.d)}）</td><td><span class="num" style="font-size:15px">${p.xs.map(fmtSet).join(", ")}</span>${p.note?`<div class="hint">${esc(p.note)}</div>`:""}</td><td class="r num" style="font-size:15px">${r1(p.best)}</td><td class="r num" style="font-size:15px">${Math.round(p.vol).toLocaleString()}</td></tr>`).join("")}
      </tbody></table></div>`:`<div class="empty">この種目の記録はまだありません。</div>`}
      <button type="button" class="btn danger" data-act="exdel" data-armed="0">この種目を削除</button></section>`;
  }
  const items = list.length ? PARTS.map(p=>{ const xs=list.filter(e=>e.part===p); if(!xs.length) return "";
    return `<div class="partlabel">${p}</div>` + xs.map(e=>{ const h=exHistory(e.id); const o=h.length?overload(isoWeek(h[h.length-1].d),e.id):null;
      return `<button type="button" class="exitem" data-act="exopen" data-id="${e.id}"><span><span class="nm">${esc(e.name)}</span><br><span class="sub">${h.length?`最新 ${md(h[h.length-1].d)}・推定1RM ${r1(h[h.length-1].best)}kg`:"記録なし"}</span></span><span class="rt">${o?`<span class="pill ${o.cls}">${o.label}</span>`:""}<span class="hint">›</span></span></button>`; }).join(""); }).join("")
    : `<div class="empty">種目がまだありません。下で追加するか、<button type="button" class="btn" data-act="presets">よく使う種目をまとめて追加</button></div>`;
  return `<section class="card"><h2>種目を追加</h2><div class="grid2" style="grid-template-columns:2fr 1fr">
      <label class="f">種目名<input id="n-name" placeholder="例：ペックフライ"></label>
      <label class="f">部位<select id="n-part">${PARTS.map(p=>`<option>${p}</option>`).join("")}</select></label></div>
      <button type="button" class="btn pri" data-act="exadd" ${!S.db||S.ro?"disabled":""}>追加</button></section>
    <section class="card"><h2>種目一覧<span class="sp hint">判定は最後に行った週の前回比</span></h2><div class="exlist">${items}</div></section>
    <section class="card"><h2>データ</h2>
      <div class="row"><button type="button" class="btn" data-act="dl">全データを書き出す（JSON）</button>
      <label class="btn" for="imp">JSONを取り込む</label><input type="file" id="imp" accept="application/json,.json" hidden></div>
      <div class="hint" id="impmsg">取り込みは同じ日付・種目のデータを上書きします。</div>
      <div class="row"><span class="hint">ログイン中：${esc(S.user?.email||"")}</span><button type="button" class="btn ghost" data-act="logout">ログアウト</button></div></section>`;
}
function vLogin(){
  if(!window.KINTORE_FIREBASE_CONFIG) return `<div class="login"><div class="notice">設定ファイル config.js が見つかりません。README の手順で作成してください。</div></div>`;
  return `<form class="login card" id="loginform" style="padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)">
    <h2>ログイン</h2>
    <label class="f">メールアドレス<input id="li-email" type="email" autocomplete="username" required></label>
    <label class="f">パスワード<input id="li-pw" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn pri big">ログイン</button>
    <div class="hint" id="li-msg">${esc(S.loginMsg||"")}</div></form>`;
}

/* ---------- markdown copy (quick export; the weekly record file has its own format) ---------- */
function weekMarkdown(wk){
  const W=weekSummary(wk); const L=[];
  L.push(`# 筋トレ ${wk}（${W.days[0]}〜${W.days[6]}）`,"",`- 出典：筋トレノート（アプリ）からコピー`,`- 作成日：${today()}`,"","## 今週意識したこと","",W.wkdoc.focus||"（記入なし）","","## ジムの予実","","| 日付 | 予定 | 実績 |","|---|---|---|");
  for(const d of W.days){ const p=(W.wkdoc.confirmedPlan||W.wkdoc.plan||[]).find(x=>x.date===d); const tr=W.trained.includes(d); if(!p&&!tr) continue; L.push(`| ${d}（${dowOf(d)}） | ${p?"予定"+(p.time?" "+p.time:""):"—"} | ${tr?"実施":(d<today()?"未実施":"—")} |`); }
  L.push("",`- 予定 ${W.planned.length}日／実施 ${W.trained.length}日（予定通り ${W.done.length}・予定外 ${W.extra.length}・未実施 ${W.missed.length}）`,"","## 部位別セット数","","| 部位 | セット |","|---|---|");
  PARTS.forEach(p=>{ if(W.parts[p]) L.push(`| ${p} | ${W.parts[p]} |`); });
  L.push("","## 種目ごとの判定","","| 種目 | 推定1RM | 前回比 | 判定 |","|---|---|---|---|");
  W.ex.forEach(id=>{ const o=overload(wk,id); if(o) L.push(`| ${exName(id)} | ${r1(o.cur.best)} | ${o.prev?(o.dE>=0?"+":"")+r1(o.dE*100)+"%":"—"} | ${o.label} |`); });
  L.push("","## 日ごとの記録","");
  for(const d of W.days){ const s=S.ses[d]; if(!s||(!(s.sets||[]).length&&!s.memo&&!s.condition)) continue;
    L.push(`### ${d}（${dowOf(d)}）`,"",`- 体調：${s.condition??"不明"}／体重：${s.bw||"不明"}／睡眠：${s.sleep||"不明"}`, `- メモ：${s.memo||"（なし）"}`,"","| 種目 | 区分 | 重量kg | 回数 | RIR | レスト秒 | 推定1RM |","|---|---|---|---|---|---|---|");
    (s.sets||[]).forEach(x=>L.push(`| ${exName(x.ex)} | ${x.wu?"W-up":"本番"} | ${+x.w} | ${+x.r} | ${x.rir??""} | ${x.rest||""} | ${x.wu?"":r1(e1rm(x.w,x.r,x.rir))} |`)); L.push("");
    const notes=Object.entries(s.exNotes||{}).filter(([,v])=>v&&v.trim()); if(notes.length){ L.push("種目メモ：",...notes.map(([k,v])=>`- ${exName(k)}：${v}`),""); } }
  return L.join("\n");
}

/* ---------- events ---------- */
const v = document.getElementById("view");
const num = x => { const n=parseFloat(String(x).replace(",",".")); return isFinite(n)?n:0; };
function updPreview(){ const el=document.getElementById("f-prev"); if(!el) return; const f=S.form; el.innerHTML=(+f.w>0&&+f.r>0)?`推定1RM <b class="num">${r1(e1rm(f.w,f.r,f.rir))}kg</b>`:""; }
v.addEventListener("input", e=>{
  const t=e.target, id=t.id;
  if(id==="f-w"){ S.form.w=t.value; updPreview(); remember(); }
  else if(id==="f-r"){ S.form.r=t.value; updPreview(); remember(); }
  else if(id==="f-rest"){ S.form.rest=t.value; remember(); }
  else if(["f-bw","f-sleep","f-memo"].includes(id)){ const k={"f-bw":"bw","f-sleep":"sleep","f-memo":"memo"}[id]; const d=S.date;
    const s=S.ses[d]||blankSession(d); S.ses[d]={...s,[k]:t.value}; dirty["sessions/"+d]=1; debounce("s"+d,700,()=>mutateSession(d,x=>{x[k]=S.ses[d][k];},false)); }
  else if(t.classList.contains("exnote")){ const d=S.date, ex=t.dataset.ex; const s=S.ses[d]||blankSession(d);
    S.ses[d]={...s, exNotes:{...(s.exNotes||{}),[ex]:t.value}}; dirty["sessions/"+d]=1; debounce("s"+d,700,()=>mutateSession(d,x=>{x.exNotes=S.ses[d].exNotes;},false)); }
  else if(id==="f-focus"){ const k=S.week; const w=S.wk[k]||blankWeek(k); S.wk[k]={...w,focus:t.value}; dirty["weeks/"+k]=1; debounce("w"+k,700,()=>mutateWeek(k,x=>{x.focus=S.wk[k].focus;},false)); }
  else if(id==="e-memo"||id==="e-name"){ const ex=S.ex[S.exSel]; if(!ex) return; const k=id==="e-memo"?"memo":"name"; S.ex[S.exSel]={...ex,[k]:t.value};
    const eid=S.exSel; dirty["exercises/"+eid]=1; debounce("e"+eid,700,()=>{ if(S.ex[eid] && S.ex[eid].name.trim()) save("exercises/"+eid, S.ex[eid]); }); }
});
v.addEventListener("change", e=>{
  const t=e.target, id=t.id;
  if(id==="f-date" && t.value){ S.date=t.value; S.editing=null; render(); }
  else if(id==="f-ex"){ S.form.ex=t.value; S.editing=null; const last=t.value?lastSetsOf(t.value,S.date+"~"):null;
    if(last){ const x=last.xs.find(x=>!x.wu)||last.xs[0]; S.form.w=String(+x.w); S.form.r=String(+x.r); } render(); }
  else if(id==="e-part"){ const ex=S.ex[S.exSel]; if(ex){ S.ex[S.exSel]={...ex,part:t.value}; save("exercises/"+S.exSel,S.ex[S.exSel]); render(); } }
  else if(t.dataset.act==="ptime"){ const d=t.dataset.d; mutateWeek(S.week,w=>{ const p=w.plan.find(x=>x.date===d); if(p) p.time=t.value; },false); }
  else if(id==="imp" && t.files && t.files[0]){ const msg=document.getElementById("impmsg"); const rd=new FileReader();
    rd.onload=()=>{ try{ const j=JSON.parse(rd.result); let n=0;
        for(const [col,key] of [["exercises","ex"],["sessions","ses"],["weeks","wk"]]){ const o=j[col]||{}; for(const [id2,doc] of Object.entries(o)){ if(!doc||typeof doc!=="object") continue; S[key][id2]=doc; save(col+"/"+id2, doc); n++; } }
        msg.textContent = n+" 件を取り込みました。"; render(); }
      catch(err){ msg.textContent="JSONを読めませんでした。書き出したファイルか確認してください。"; } };
    rd.readAsText(t.files[0]); }
});
v.addEventListener("submit", e=>{
  if(e.target.id!=="loginform") return; e.preventDefault();
  const em=document.getElementById("li-email").value.trim(), pw=document.getElementById("li-pw").value;
  const msg=document.getElementById("li-msg"); msg.textContent="ログイン中…";
  firebase.auth().signInWithEmailAndPassword(em,pw).catch(err=>{
    S.loginMsg = /invalid|wrong|not-found|credential/.test(err.code||"") ? "メールアドレスかパスワードが違います" : err.code==="auth/too-many-requests" ? "試行が多すぎます。しばらく待ってください" : "ログインできませんでした（通信を確認してください）";
    msg.textContent=S.loginMsg; });
});
v.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, f=S.form;
  if(b.tagName!=="INPUT"){ const ae=document.activeElement; if(ae && ae!==b && ae.blur && ae.closest && ae.closest("#view")) ae.blur(); pending=false; }
  if(a==="w+"||a==="w-"){ const st = num(f.w)>=20?2.5:1; f.w=String(Math.max(0,r1(num(f.w)+(a==="w+"?st:-st)))); render(); }
  else if(a==="r+"||a==="r-"){ f.r=String(Math.max(0,Math.round(num(f.r))+(a==="r+"?1:-1))); render(); }
  else if(a==="rir"){ f.rir=b.dataset.v; render(); }
  else if(a==="wu"){ f.wu=!f.wu; render(); }
  else if(a==="gotoday"){ S.date=today(); S.editing=null; render(); }
  else if(a==="addset"){
    if(!f.ex){ alertLine("種目を選んでください"); return; }
    if(!(num(f.w)>=0) || !(num(f.r)>0)){ alertLine("回数を入れてください"); return; }
    let rest = Math.round(num(f.rest)); if(!rest && restStart && !S.editing && S.date===today()){ rest = Math.round((Date.now()-restStart)/5000)*5; if(rest>1200) rest=0; }
    const rec = {ex:f.ex, w:num(f.w), r:Math.round(num(f.r)), rir:f.rir, rest:rest||"", wu:!!f.wu};
    if(S.editing){ const eid=S.editing; mutateSession(S.date,s=>{ const x=s.sets.find(x=>x.id===eid); if(x) Object.assign(x,rec,{rest:num(f.rest)?Math.round(num(f.rest)):x.rest}); }); S.editing=null; f.rest=""; render(); }
    else { mutateSession(S.date,s=>{ s.sets.push({id:uid("s"),...rec,t:new Date().toISOString()}); }); f.rest=""; if(S.date===today()){ restStart=Date.now(); } render(); }
  }
  else if(a==="edit"){ const s=S.ses[S.date]; const x=s&&s.sets.find(x=>x.id===b.dataset.id); if(!x) return;
    S.editing=x.id; Object.assign(S.form,{ex:x.ex,w:String(x.w),r:String(x.r),rir:String(x.rir??""),rest:String(x.rest||""),wu:!!x.wu}); render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(a==="canceledit"){ S.editing=null; f.rest=""; render(); }
  else if(a==="delset"){ const eid=S.editing; mutateSession(S.date,s=>{ s.sets=s.sets.filter(x=>x.id!==eid); }); S.editing=null; render(); }
  else if(a==="cond"){ const val=+b.dataset.v; mutateSession(S.date,s=>{ s.condition = s.condition===val?null:val; }); }
  else if(a==="wk-"||a==="wk+"){ S.week=shiftWeek(S.week,a==="wk+"?1:-1); render(); }
  else if(a==="wk0"){ S.week=isoWeek(today()); render(); }
  else if(a==="plan"){ const d=b.dataset.d; mutateWeek(S.week,w=>{ const i=w.plan.findIndex(x=>x.date===d); if(i>=0) w.plan.splice(i,1); else { w.plan.push({date:d,time:""}); w.plan.sort((x,y)=>x.date<y.date?-1:1); } }); }
  else if(a==="confirm"){ mutateWeek(S.week,w=>{ w.confirmedAt=new Date().toISOString(); w.confirmedPlan=clone(w.plan||[]); w.history=(w.history||[]).concat([{at:w.confirmedAt,plan:clone(w.plan||[])}]); }); }
  else if(a==="copymd"){ const text=weekMarkdown(S.week);
    try{ await navigator.clipboard.writeText(text); b.textContent="コピーしました"; }
    catch(err){ const ta=document.createElement("textarea"); ta.value=text; ta.rows=10; b.after(ta); ta.focus(); ta.select(); b.textContent="下の文字を選択してコピーしてください"; } }
  else if(a==="exopen"){ S.exSel=b.dataset.id; render(); window.scrollTo({top:0}); }
  else if(a==="exback"){ S.exSel=null; render(); }
  else if(a==="exadd"){ const n=document.getElementById("n-name").value.trim(), p=document.getElementById("n-part").value; if(!n){ alertLine("種目名を入れてください"); return; }
    if(Object.values(S.ex).some(x=>x.name===n)){ alertLine("同じ名前の種目があります"); return; }
    const id=uid("ex"); S.ex[id]={name:n,part:p,memo:"",order:Date.now(),createdAt:new Date().toISOString()}; save("exercises/"+id,S.ex[id]); render(); }
  else if(a==="exdel"){ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="もう一度押すと削除（過去の記録は残ります）"; return; }
    const id=S.exSel; delete S.ex[id]; save("exercises/"+id,null); S.exSel=null; render(); }
  else if(a==="logout"){ firebase.auth().signOut(); }
  else if(a==="dl"){ const data={exportedAt:new Date().toISOString(),source:"筋トレノート（Web）",exercises:S.ex,sessions:S.ses,weeks:S.wk};
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
    const a2=document.createElement("a"); a2.href=url; a2.download="kintore-"+today()+".json"; document.body.appendChild(a2); a2.click(); a2.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); }
  else if(a==="presets"){ let i=0; for(const [n,p] of PRESETS){ if(Object.values(S.ex).some(x=>x.name===n)) continue; const id=uid("ex"); S.ex[id]={name:n,part:p,memo:"",order:i++,createdAt:new Date().toISOString()}; save("exercises/"+id,S.ex[id]); } render(); }
});
v.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("setline")){ e.preventDefault(); e.target.click(); } });
document.querySelector("nav.tabs").addEventListener("click", e=>{ const b=e.target.closest("button[data-tab]"); if(!b) return; S.tab=b.dataset.tab; if(S.tab!=="ex") S.exSel=null; render(); window.scrollTo({top:0}); });
function alertLine(msg){ const el=document.getElementById("status"); el.dataset.s="err"; el.lastChild.textContent=msg; setTimeout(setStatus,2500); }

/* rest timer */
function tick(){ const bar=document.getElementById("rest");
  if(!restStart || Date.now()-restStart>20*60000 || S.tab!=="today"){ bar.hidden=true; return; }
  const s=Math.floor((Date.now()-restStart)/1000); bar.hidden=false; document.getElementById("restt").textContent=Math.floor(s/60)+":"+pad(s%60); }
setInterval(tick,1000);
document.getElementById("restx").addEventListener("click",()=>{ restStart=null; remember(); tick(); });

/* ---------- boot: Firebase (Auth + Firestore with offline cache) ---------- */
render();
(() => {
  if(!window.firebase || !window.KINTORE_FIREBASE_CONFIG){ render(); return; }
  firebase.initializeApp(window.KINTORE_FIREBASE_CONFIG);
  const fs = firebase.firestore();
  fs.settings({ignoreUndefinedProperties:true, merge:true});
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{ /* private mode etc.: works online only */ });
  let unsubs = [];
  firebase.auth().onAuthStateChanged(user=>{
    unsubs.forEach(u=>u()); unsubs=[];
    S.user = user || null; S.ex={}; S.ses={}; S.wk={}; S.loaded={ex:false,ses:false,wk:false}; S.err=""; S.ro=false;
    if(!user){ S.db=null; render(); return; }
    const base = "users/"+user.uid+"/";
    // same small surface the page already uses: doc(path) / collection(path), scoped to this user
    S.db = { doc:p=>fs.doc(base+p), collection:p=>fs.collection(base+p) };
    S.loginMsg=""; render();
    const timeout = setTimeout(()=>{ if(!(S.loaded.ex&&S.loaded.ses&&S.loaded.wk)) setStatus(); },10000);
    const sub = (col, key) => S.db.collection(col).onSnapshot({includeMetadataChanges:true}, snap=>{
      const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); });
      // keep text the viewer is still typing (not yet saved)
      for(const p of Object.keys(dirty)){ const [c,doc]=p.split("/"); if(c===col && S[key][doc]) m[doc]=S[key][doc]; }
      S[key]=m; if(!snap.metadata.fromCache){ S.loaded[key]=true; if(S.loaded.ex&&S.loaded.ses&&S.loaded.wk) clearTimeout(timeout); }
      render();
    }, err=>{ S.err = err.code==="permission-denied" ? "このアカウントでは読めません" : "同期が止まりました。ページを開き直してください"; setStatus(); });
    unsubs = [sub("exercises","ex"), sub("sessions","ses"), sub("weeks","wk")];
  });
})();
})();
